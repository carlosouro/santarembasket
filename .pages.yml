# Configuração do Pages CMS (https://pagescms.org) para o Santarém Basket Clube
media:
  input: assets/images
  output: /assets/images

content:
  - name: destaques
    label: 📢 Destaques & Formulários
    type: file
    path: data/destaques.json
    list: true
    fields:
      - name: id
        label: Identificador Único (slug)
        type: string
        required: true
      - name: titulo
        label: Título do Destaque
        type: string
        required: true
      - name: categoria
        label: Categoria (ex: Inscrições, Formação, Notícia)
        type: string
      - name: badge
        label: Etiqueta Visual (ex: Candidaturas Abertas)
        type: string
      - name: descricao
        label: Texto Explicativo
        type: rich-text
      - name: link
        label: Link do Formulário (ex: Google Forms) ou Notícia Externa
        type: string
        required: true
      - name: textoBotao
        label: Texto do Botão (ex: Preencher Formulário)
        type: string
      - name: externo
        label: Abrir Link em Nova Aba?
        type: boolean
        default: true
      - name: destaque
        label: Mostrar na Página Principal?
        type: boolean
        default: true

  - name: treinos
    label: 🏀 Horários de Treinos
    type: file
    path: data/treinos.json
    list: true
    fields:
      - name: id
        label: ID da Equipa
        type: string
        required: true
      - name: escalao
        label: Nome do Escalão (ex: Sub-14 Masculinos)
        type: string
        required: true
      - name: genero
        label: Género / Escalão
        type: select
        options:
          - Masculino
          - Feminino
          - Misto
      - name: slug
        label: Código de Ligação (ex: sub12-m, sub14-m, sub16-m, sub18-m, seniores-m)
        type: string
        required: true
      - name: treinador
        label: Treinador / Equipa Técnica
        type: string
      - name: horarios
        label: Sessões Semanais de Treino
        type: list
        fields:
          - name: dia
            label: Dia da Semana
            type: select
            options:
              - Segunda-feira
              - Terça-feira
              - Quarta-feira
              - Quinta-feira
              - Sexta-feira
              - Sábado
              - Domingo
          - name: inicio
            label: Hora de Início (ex: 18:30)
            type: string
          - name: fim
            label: Hora de Término (ex: 20:00)
            type: string
          - name: local
            label: Pavilhão / Instalação
            type: select
            options:
              - Pavilhão Municipal de Santarém
              - Nave Desportiva de Santarém

  - name: parceiros
    label: 🤝 Parceiros, Apoios & Protocolos
    type: file
    path: data/parceiros.json
    fields:
      - name: institucionais
        label: Parceiros Institucionais
        type: list
        fields:
          - name: nome
            label: Nome da Instituição
            type: string
          - name: tipo
            label: Tipo de Instituição
            type: string
          - name: descricao
            label: Descrição do Apoio
            type: text
          - name: link
            label: Website Oficial
            type: string
      - name: patrocinadores
        label: Patrocinadores & Empresas
        type: list
        fields:
          - name: nome
            label: Nome da Empresa
            type: string
          - name: tipo
            label: Tipo de Parceria
            type: string
          - name: descricao
            label: Descrição
            type: text
          - name: link
            label: Website
            type: string
      - name: protocolos
        label: Protocolos & Vantagens para Sócios
        type: list
        fields:
          - name: entidade
            label: Entidade Parceira (Clínica, Loja, etc.)
            type: string
          - name: categoria
            label: Área de Atuação (ex: Saúde & Recuperação)
            type: string
          - name: vantagem
            label: Benefício / Desconto Concedido
            type: text

  - name: palmares
    label: 🏆 Palmarés & Estatísticas
    type: file
    path: data/palmares.json
    fields:
      - name: estatisticas
        label: Resumo Numérico
        type: object
        fields:
          - name: anosHistoria
            label: Anos de História
            type: number
          - name: titulosNacionais
            label: Títulos Nacionais Conquistados
            type: number
          - name: tacasPortugal
            label: Taças de Portugal Conquistadas
            type: number
          - name: supertacas
            label: Supertaças Nacionais Conquistadas
            type: number
          - name: titulosDistritais
            label: Títulos Distritais Conquistados
            type: number
